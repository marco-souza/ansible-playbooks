---
- name: (shared) Install base packages
  become: "{{ is_manjaro }}"
  ansible.builtin.package:
    state: present
    name: "{{ base_packages }}"

- name: (manjaro) Install AUR packages
  when: is_manjaro
  kewlfft.aur.aur:
    use: yay
    name: "{{ aur_packages }}"

- name: (osx) Install cask packages
  when: is_osx
  community.general.homebrew_cask:
    state: upgraded
    name: "{{ cask_packages }}"

